name: PR Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded hex colors in script block
        run: |
          SCRIPT_START=$(grep -n "</style>" index.html | tail -1 | cut -d: -f1)
          VIOLATIONS=$(tail -n +$SCRIPT_START index.html \
            | grep -nE "color\s*:\s*'#[0-9a-fA-F]{3,6}'|borderColor\s*:\s*'#|backgroundColor\s*:\s*'#[0-9a-fA-F]{6}'" \
            | grep -v "rgba\|var(--" || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Hardcoded hex colors found in script block — use CSS vars instead:"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "No hardcoded hex violations found."

      - name: Verify sw.js cache version
        run: |
          if ! grep -qE "jfit-v[0-9]+" sw.js; then
            echo "::error::sw.js is missing a versioned cache name (jfit-vN)"
            exit 1
          fi
          echo "Cache version OK: $(grep -oE "jfit-v[0-9]+" sw.js | head -1)"

      - name: Verify manifest.json is valid JSON
        run: python3 -c "import json,sys; json.load(open('manifest.json'))" && echo "manifest.json OK"

      - name: Check AI_COLLAB.md activity log was updated
        run: |
          if ! git diff --name-only origin/main...HEAD | grep -q "AI_COLLAB.md"; then
            echo "::warning::AI_COLLAB.md was not updated in this PR — add an entry to the Activity Log"
          else
            echo "AI_COLLAB.md updated."
          fi

      - name: Post PR summary comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            const changed = files.data.map(f => f.filename).join(', ');
            const additions = files.data.reduce((s, f) => s + f.additions, 0);
            const deletions = files.data.reduce((s, f) => s + f.deletions, 0);
            const body = `### ✅ PR Checks Passed\n\n` +
              `**Files changed:** ${files.data.length} (${changed})\n` +
              `**Lines:** +${additions} / -${deletions}\n\n` +
              `All validations passed:\n` +
              `- No hardcoded hex colors in script block\n` +
              `- \`sw.js\` cache version present\n` +
              `- \`manifest.json\` is valid JSON\n\n` +
              `> Merge when ready — auto-deploy to GitHub Pages will run on merge to \`main\`.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
